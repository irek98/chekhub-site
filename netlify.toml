# Заголовки безопасности и кэширование для chekhub.ru (Netlify).
#
# Кэш статики короткий (1 час + must-revalidate): имена файлов без хэшей,
# поэтому «immutable на год» сломал бы доставку правок app.js и style.css
# вернувшимся посетителям. HTML — всегда перепроверяем.

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/files/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
